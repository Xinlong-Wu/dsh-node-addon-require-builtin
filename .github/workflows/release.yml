name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish packed tarballs to npm. Must run from a v* tag.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    name: Matrix
    runs-on: ubuntu-24.04
    outputs:
      platforms: ${{ steps.matrix.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4

      - id: matrix
        run: echo "platforms=$(node ./scripts/github-matrix.mjs release-platforms)" >> "$GITHUB_OUTPUT"

  build-and-test-napi:
    name: ${{ matrix.family }} / ${{ matrix.platform }} / build and test napi
    needs: matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.platforms) }}
    env:
      # Each matrix entry builds and tests exactly one product family.
      NARB_PRODUCT: ${{ matrix.family }}
    steps:
      - uses: actions/checkout@v4

      # No hosted riscv64 runner exists: the prebuild is cross-compiled
      # natively on the runner and the behavioral tests run in a riscv64
      # Debian container under QEMU (see ci.yml for the full rationale).
      - name: Set up QEMU (riscv64 test container)
        if: matrix.platform == 'linux-riscv64-gnu'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.build_node }}
          architecture: ${{ matrix.nodearch }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # pnpm's default script shell on Windows runners cannot run the POSIX-style
      # inline env assignments in package.json scripts; Git Bash can.
      - name: Use bash for pnpm scripts (Windows)
        if: runner.os == 'Windows'
        run: pnpm config set script-shell "C:\Program Files\Git\bin\bash.exe"

      - name: Install dependencies without package install scripts
        run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Build TypeScript entrypoints
        run: pnpm build:ts

      - name: Select VS2022-compatible ARM64 toolchain
        if: matrix.platform == 'win32-arm64-msvc'
        shell: pwsh
        run: ./scripts/prepare-windows-arm64-toolchain.ps1

      - name: Build N-API prebuild
        if: runner.os != 'Linux'
        run: pnpm build:prebuild:napi
        env:
          npm_config_msvs_version: ${{ matrix.platform == 'win32-arm64-msvc' && env.npm_config_msvs_version || runner.os == 'Windows' && '2022' || '' }}

      - name: Build and test N-API prebuild on glibc 2.28
        if: runner.os == 'Linux' && matrix.platform != 'linux-riscv64-gnu'
        shell: bash
        run: |
          case "$RUNNER_ARCH" in
            X64) image=quay.io/pypa/manylinux_2_28_x86_64:latest ;;
            ARM64) image=quay.io/pypa/manylinux_2_28_aarch64:latest ;;
            *) echo "unsupported Linux runner architecture: $RUNNER_ARCH" >&2; exit 1 ;;
          esac

          node_root="$(dirname "$(dirname "$(command -v node)")")"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env NARB_BACKEND=napi \
            --env NARB_BUILD_OUTPUT=prebuild \
            --env NARB_PRODUCT \
            --volume "$node_root:/opt/node:ro" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$image" \
            bash -ceu '
              export PATH=/opt/node/bin:$PATH
              printf "%s\n" \
                "#!/usr/bin/env bash" \
                "exec g++ \"\$@\" -ldl" \
                > /tmp/narb-cxx
              chmod +x /tmp/narb-cxx
              export CXX=/tmp/narb-cxx

              node --import tsx ./scripts/build.ts
              env -u LD_LIBRARY_PATH \
                NARB_EXPECTED_BACKEND=napi NARB_DISABLE_LOCAL_BUILD=1 \
                node ./test/backend.test.js
              env -u LD_LIBRARY_PATH NARB_DISABLE_LOCAL_BUILD=1 \
                node --expose-internals ./test/require-parity.test.js
            '

      - name: Install riscv64 cross toolchain
        if: runner.os == 'Linux' && matrix.platform == 'linux-riscv64-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-14-riscv64-linux-gnu libc6-dev-riscv64-cross

      - name: Cross-compile N-API prebuild
        if: runner.os == 'Linux' && matrix.platform == 'linux-riscv64-gnu'
        shell: bash
        run: |
          # Cross toolchain sysroot = Ubuntu 24.04 glibc 2.39, the baseline
          # manylinux_2_39 (riscv64) pins; floors asserted below.
          NARB_PRODUCT="${{ matrix.family }}" \
            CXX=riscv64-linux-gnu-g++-14 pnpm build:prebuild:napi

      - name: Test N-API prebuild under riscv64 emulation
        if: runner.os == 'Linux' && matrix.platform == 'linux-riscv64-gnu'
        shell: bash
        run: |
          image=riscv64/debian:trixie
          docker pull --platform linux/riscv64 "$image"
          docker run --rm --platform linux/riscv64 \
            --env NARB_PRODUCT \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$image" \
            bash -ceu '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends nodejs >/dev/null
              env -u LD_LIBRARY_PATH \
                NARB_EXPECTED_BACKEND=napi NARB_DISABLE_LOCAL_BUILD=1 \
                node ./test/backend.test.js
              env -u LD_LIBRARY_PATH NARB_DISABLE_LOCAL_BUILD=1 \
                node --expose-internals ./test/require-parity.test.js
            '

      - name: Check N-API prebuild output
        run: |
          node -e "const fs = require('node:fs'); const file = '${{ matrix.prebuilt_path }}/${{ matrix.filename }}'; if (!fs.existsSync(file)) throw new Error('missing prebuild: ' + file);"

      - name: Verify Linux prebuild compatibility
        if: runner.os == 'Linux'
        shell: bash
        run: |
          file='${{ matrix.prebuilt_path }}/${{ matrix.filename }}'
          max_glibc="$({
            readelf --version-info "$file" \
              | sed -n 's/.*Name: GLIBC_\([0-9][0-9.]*\).*/\1/p'
          } | sort -Vu | tail -n 1)"
          if [ -z "$max_glibc" ]; then
            echo "no GLIBC version requirements found in $file" >&2
            exit 1
          fi
          floor='${{ matrix.glibc_floor }}'
          if [ "$(printf '%s\n' "$floor" "$max_glibc" | sort -V | tail -n 1)" != "$floor" ]; then
            echo "glibc floor regressed: GLIBC_$max_glibc is newer than GLIBC_$floor" >&2
            exit 1
          fi

          max_glibcxx="$({
            readelf --version-info "$file" \
              | sed -n 's/.*Name: GLIBCXX_\([0-9][0-9.]*\).*/\1/p'
          } | sort -Vu | tail -n 1)"
          if [ -z "$max_glibcxx" ]; then
            echo "no GLIBCXX version requirements found in $file" >&2
            exit 1
          fi
          cxxfloor='${{ matrix.glibcxx_floor }}'
          if [ "$(printf '%s\n' "$cxxfloor" "$max_glibcxx" | sort -V | tail -n 1)" != "$cxxfloor" ]; then
            echo "libstdc++ floor regressed: GLIBCXX_$max_glibcxx is newer than GLIBCXX_$cxxfloor" >&2
            exit 1
          fi

          dynamic="$(readelf --dynamic "$file")"
          # glibc 2.34 folded libdl into libc, so a build against the riscv64
          # baseline (Debian trixie, glibc 2.41) records no libdl.so.2 NEED.
          if [ "${{ matrix.platform }}" != 'linux-riscv64-gnu' ]; then
            grep -q 'Shared library: \[libdl.so.2\]' <<<"$dynamic" || {
              echo "Linux prebuild does not declare its libdl.so.2 dependency" >&2
              exit 1
            }
          fi
          if ! grep -q 'Shared library: \[libstdc++\.so\.6\]' <<<"$dynamic"; then
            echo "Linux prebuild does not declare its shared libstdc++ runtime" >&2
            exit 1
          fi

      - name: Verify Windows prebuild compatibility
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $file = '${{ matrix.prebuilt_path }}/${{ matrix.filename }}'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -property installationPath
          if (-not $installation) {
            throw 'Visual Studio installation not found'
          }
          $pattern = Join-Path $installation 'VC\Tools\MSVC\*\bin\Host*\*\dumpbin.exe'
          $dumpbin = Get-ChildItem $pattern | Select-Object -First 1
          if (-not $dumpbin) {
            throw 'dumpbin.exe not found'
          }

          $dependencies = & $dumpbin.FullName /DEPENDENTS $file | Out-String
          Write-Host $dependencies
          $forbidden = [regex]::Matches(
            $dependencies,
            '(?im)^\s*((?:vcruntime|msvcp|ucrtbase|api-ms-win-crt)[^\s]*\.dll)\s*$'
          )
          if ($forbidden.Count -ne 0) {
            $names = $forbidden | ForEach-Object { $_.Groups[1].Value }
            throw "Windows prebuild has dynamic C/C++ runtime dependencies: $($names -join ', ')"
          }

      - name: Test N-API prebuild on Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          architecture: ${{ matrix.nodearch }}

      - name: Test N-API prebuild on Node 20
        run: |
          node ./test/backend.test.js
          node --expose-internals ./test/require-parity.test.js
        env:
          NARB_BACKEND: napi
          NARB_EXPECTED_BACKEND: napi
          NARB_DISABLE_LOCAL_BUILD: 1

      - name: Test N-API prebuild on Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.nodearch }}

      - name: Test N-API prebuild on Node 22
        run: |
          node ./test/backend.test.js
          node --expose-internals ./test/require-parity.test.js
        env:
          NARB_BACKEND: napi
          NARB_EXPECTED_BACKEND: napi
          NARB_DISABLE_LOCAL_BUILD: 1

      - name: Test N-API prebuild on Node 24
        if: matrix.platform != 'win32-ia32-msvc'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: ${{ matrix.nodearch }}

      - name: Test N-API prebuild on Node 24
        if: matrix.platform != 'win32-ia32-msvc'
        run: |
          node ./test/backend.test.js
          node --expose-internals ./test/require-parity.test.js
        env:
          NARB_BACKEND: napi
          NARB_EXPECTED_BACKEND: napi
          NARB_DISABLE_LOCAL_BUILD: 1

      - name: Test N-API prebuild on Node 26
        if: matrix.platform != 'win32-ia32-msvc'
        uses: actions/setup-node@v4
        with:
          node-version: 26
          architecture: ${{ matrix.nodearch }}

      - name: Test N-API prebuild on Node 26
        if: matrix.platform != 'win32-ia32-msvc'
        run: |
          node ./test/backend.test.js
          node --expose-internals ./test/require-parity.test.js
        env:
          NARB_BACKEND: napi
          NARB_EXPECTED_BACKEND: napi
          NARB_DISABLE_LOCAL_BUILD: 1

      - name: Prepare Node.js public headers
        run: pnpm -s headers -- --github-env

      - name: Test nodeabi source build
        run: pnpm test:nodeabi

      - name: Upload N-API prebuild
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.prebuilt_path }}/${{ matrix.filename }}
          if-no-files-found: error
          retention-days: 7

  musl:
    uses: ./.github/workflows/prebuild-musl.yml

  distro-node:
    needs: [build-and-test-napi, musl]
    uses: ./.github/workflows/distro-node.yml

  packages:
    needs: [build-and-test-napi, musl]
    uses: ./.github/workflows/packages.yml
    with:
      publish: ${{ inputs.publish }}

  publish:
    name: Publish to npm
    if: inputs.publish
    needs: [packages, distro-node]
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Do not create setup-node's token-based .npmrc. The publish command uses
      # the explicit npm registry and authenticates only through GitHub OIDC.
      - name: Check OIDC publishing prerequisites
        shell: bash
        run: |
          node --version
          npm_version="$(npm --version)"
          echo "npm $npm_version"
          node - "$npm_version" <<'NODE'
          const version = process.argv[2];
          const [major, minor, patch] = version.split('.').map(Number);
          if (!/^\d+\.\d+\.\d+$/.test(version) || major < 11 ||
              (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
            throw new Error(`npm >=11.5.1 is required for trusted publishing; got ${version}`);
          }
          for (const name of ['ACTIONS_ID_TOKEN_REQUEST_URL', 'ACTIONS_ID_TOKEN_REQUEST_TOKEN']) {
            if (!process.env[name]) throw new Error(`Missing GitHub OIDC variable: ${name}`);
          }
          NODE

      - name: Download npm tarballs
        uses: actions/download-artifact@v4
        with:
          name: npm-tarballs
          path: dist/npm

      - name: Publish tarballs
        run: |
          while IFS= read -r tarball; do
            npm publish "dist/npm/${tarball}" --access public --registry=https://registry.npmjs.org
          done < dist/npm/publish-order.txt
        env:
          # The publishing repository is internal; npm provenance requires a
          # public source repository. OIDC authentication is independent of it.
          NPM_CONFIG_PROVENANCE: "false"
