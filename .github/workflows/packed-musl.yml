name: Packed musl install

on:
  workflow_call:

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      platforms: ${{ steps.matrix.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: echo "platforms=$(node scripts/github-matrix.mjs ci-musl-platforms)" >> "$GITHUB_OUTPUT"

  install:
    name: 'npm install: musl / ${{ matrix.arch }} / Node 20/22/24/26'
    runs-on: ${{ matrix.runner }}
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.platforms) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarballs
          path: dist/npm
      - name: Install and load the same tarballs in musl Node 20, 22, 24 and 26
        shell: bash
        run: |
          test "$RUNNER_ARCH" = '${{ matrix.runner_arch }}'
          status=0
          for major in 20 22 24 26; do
            echo "::group::Node $major / musl / ${{ matrix.arch }}"
            image="docker.io/library/node:$major-alpine3.23"
            if ! bash scripts/pull-container.sh "$image" --platform '${{ matrix.docker_platform }}'; then
              status=1
              echo "::endgroup::"
              continue
            fi
            docker run --rm --pull=never --platform '${{ matrix.docker_platform }}' \
              --network none --read-only --tmpfs /tmp:rw,exec,nosuid \
              --env NARB_EXPECTED_ARCH=${{ matrix.arch }} --env NARB_EXPECTED_LIBC=musl \
              --volume "$GITHUB_WORKSPACE:/workspace:ro" --workdir /workspace \
              "$image" \
              node scripts/verify-packed-install.mjs dist/npm || status=1
            echo "::endgroup::"
          done
          exit "$status"
