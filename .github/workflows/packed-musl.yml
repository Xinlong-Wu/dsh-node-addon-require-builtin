name: Packed musl install

on:
  workflow_call:

jobs:
  install:
    name: 'npm install: musl / ${{ matrix.arch }} / Node 20-26'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            runner_arch: ARM64
            platform: linux/arm64
          - arch: x64
            runner: ubuntu-24.04
            runner_arch: X64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarballs
          path: dist/npm
      - name: Install and load the same tarballs in musl Node 20, 22, 24 and 26
        shell: bash
        run: |
          test "$RUNNER_ARCH" = '${{ matrix.runner_arch }}'
          status=0
          for major in 20 22 24 26; do
            echo "::group::Node $major / musl / ${{ matrix.arch }}"
            docker run --rm --platform '${{ matrix.platform }}' \
              --network none --read-only --tmpfs /tmp:rw,exec,nosuid \
              --env NARB_EXPECTED_ARCH=${{ matrix.arch }} --env NARB_EXPECTED_LIBC=musl \
              --volume "$GITHUB_WORKSPACE:/workspace:ro" --workdir /workspace \
              "public.ecr.aws/docker/library/node:$major-alpine3.23" \
              node scripts/verify-packed-install.mjs dist/npm || status=1
            echo "::endgroup::"
          done
          exit "$status"
